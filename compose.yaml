services:
  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: devpilot
      POSTGRES_DB: devpilot
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, pg_isready -U devpilot]
      interval: 5s
      timeout: 5s
      retries: 20
  redis:
    image: redis:7-alpine
    command: [redis-server, --appendonly, "yes"]
    volumes:
      - redis-data:/data
  migrate:
    build: ./backend
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://devpilot:${POSTGRES_PASSWORD}@postgres:5432/devpilot
    command: [python, -m, alembic, upgrade, head]
    depends_on:
      postgres:
        condition: service_healthy
  api:
    build: ./backend
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://devpilot:${POSTGRES_PASSWORD}@postgres:5432/devpilot
    depends_on:
      migrate:
        condition: service_completed_successfully
    expose: ["8000"]
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
  web:
    build: ./frontend
    environment:
      API_INTERNAL_URL: http://api:8000
    ports: ["127.0.0.1:3000:3000"]
    depends_on: [api]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
volumes:
  postgres-data:
  redis-data:
